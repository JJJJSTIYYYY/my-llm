[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "my-llm-py"
dynamic = ["version"]
description = "Profile-driven async LLM adapter for OpenAI, Anthropic, Gemini and Ollama."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["adapter", "adaptor", "openai", "anthropic", "gemini", "ollama", "llm"]
authors = [
    { name = "JJJJSTIYYYY", email = "wavejustiy@gmail.com" },
]
maintainers = [
    { name = "JJJJSTIYYYY", email = "wavejustiy@gmail.com" },
]
dependencies = [
    "anthropic>=0.76,<1",
    "google-genai>=1.56,<2",
    "ollama>=0.6.3,<1",
    "openai>=2.0,<3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/JJJJSTIYYYY/my-llm-py"
Issues = "https://github.com/JJJJSTIYYYY/my-llm-py/issues"

[tool.hatch.version]
path = "src/my_llm/_version.py"

[tool.hatch.build]
exclude = ["**/.gitkeep"]

[tool.hatch.build.targets.wheel]
packages = ["src/my_llm"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/my_llm",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/docs/guides",
    "/docs/reference",
    "/tests",
    "/examples",
]

[dependency-groups]
dev = [
    "hatchling>=1.26",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "twine>=6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
